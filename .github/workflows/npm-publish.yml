# Same setup as bricks-soft/location-tracking: npm trusted publishing (OIDC, no token) with staged publishing.
# A maintainer approves the staged version on npmjs.com (Staged Packages tab) or with `npm stage approve <id>`.
name: npm package

on:
  release:
    types: [ created ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm install -g npm@latest
      - name: Release tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "$TAG" = "v$(node -p 'require("./package.json").version')"
      - name: Skip a version that is already on npm
        id: published
        run: |
          spec="$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')"
          if npm view "$spec" version >/dev/null 2>&1; then echo "$spec is already on npm" | tee -a "$GITHUB_STEP_SUMMARY"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.published.outputs.skip != 'true'
        run: npm ci
      - if: steps.published.outputs.skip != 'true'
        run: npm test
      - if: steps.published.outputs.skip != 'true'
        run: npm stage publish
