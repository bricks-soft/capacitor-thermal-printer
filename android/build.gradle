buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.13.2' }
}
apply plugin: 'com.android.library'
android {
    namespace 'com.brickssoft.thermalprinter'
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 36
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    sourceSets.test.java.srcDir '../tests/android-parity/legacy'
    testOptions.unitTests.includeAndroidResources = true
    testOptions.unitTests.all {
        maxHeapSize = '1024m'
        testLogging { events 'passed', 'failed'; exceptionFormat 'full' }
    }
}
rootProject.allprojects {
    repositories { maven { url 'https://jitpack.io' } }
}
repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}
dependencies {
    implementation project(':capacitor-android')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.github.DantSu:ESCPOS-ThermalPrinter-Android:3.2.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'org.mockito:mockito-core:5.21.0'
    testImplementation 'org.apache.cordova:framework:14.0.1'
}
